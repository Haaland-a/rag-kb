# /etc/nginx/nginx.conf —— 引导用（只在第一次签证书之前用）
#
# 为什么需要这份：正式的 nginx.conf 会去加载 443 的 server 块，而那个块
# 引用了 /etc/letsencrypt/live/<IP>/fullchain.pem —— 证书还没签下来时这个
# 文件不存在，nginx 直接启动失败，于是 ACME 校验请求也没人应答，死循环。
#
# 所以第一次按这个顺序走：
#   1. 用这份「只有 80」的配置起 nginx
#   2. certbot 走 webroot 模式把校验文件写进 /var/www/acme，nginx 从磁盘读出去
#   3. 证书签成功后再换成正式的 nginx.conf（带 443）
#
# 这份配置在签完证书后就不再使用，但保留在仓库里，换机器时可以照着再走一遍。
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile    on;
    server_tokens off;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            access_log off;
        }

        # 引导阶段（还没有证书）访问 80，不该跳 https —— 那时 https 是死的。
        # 返回一个明确的 503，而不是让浏览器看到连接被拒的空白页。
        location / {
            default_type text/plain;
            return 503 "HTTPS 证书正在签发中，请几分钟后再访问。\n";
        }
    }
}
