# /etc/nginx/conf.d/rag-kb.conf
# 由 deploy/https/install-https.sh 安装（文件里会被替换的占位符：__SERVER_IP__）
#
# 结构：
#   80  —— 只做两件事：给 ACME 校验提供 /.well-known/acme-challenge/，其余 301 到 https
#   443 —— 反代到 127.0.0.1:8080（Spring Boot），终结 TLS
#
# 为什么 443 用 IP 而不是域名：这台服务器没有域名，Let's Encrypt 从 2026-01 起
# 支持给 IP 签证书（profile=shortlived，有效期 160 小时）。证书 SAN 里就是 IP，
# 浏览器访问 https://<IP>/ 时校验通过。

# ---------- ACME 校验用的 webroot ----------
# certbot 用 --webroot 模式把校验文件写到这里，nginx 直接从磁盘读。
# 这个 location 必须放在 80 端口的 default server 里，且不能参与 301 跳转，
# 否则 Let's Encrypt 的校验请求会被重定向到 https —— 那时证书还没签下来，
# https 根本不可用，校验必然失败。
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        # 校验文件就是一段 ASCII，不需要日志噪音
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 正式站点 ----------
server {
    # CentOS 8 的 AppStream 里 nginx 是 1.14.1，还没有 `http2 on;` 这个指令
    # （那是 1.25.1 才加的）。1.14 时代 HTTP/2 只能写成 listen 的参数，
    # 所以这里是 `listen 443 ssl http2`，不能拆成单独一行。
    listen       443 ssl http2 default_server;
    listen       [::]:443 ssl http2 default_server;
    server_name  __SERVER_IP__;

    # 证书路径。certbot 用 --ip-address 签 IP 证书时，lineage 目录名就是 IP，
    # 所以 /etc/letsencrypt/live/<IP>/ 是固定的。这两个文件都是符号链接，
    # 指向 ../../archive/<IP>/xxxN.pem，续期后符号链接自动跟着换，nginx reload 即可。
    ssl_certificate      /etc/letsencrypt/live/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/__SERVER_IP__/privkey.pem;

    # 只留 TLS 1.2/1.3。1.0/1.1 早被主流浏览器判不安全，
    # 而且 IP 证书只能用 shortlived profile，本来就要求现代客户端。
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 会话缓存：2C2G 的机器上别开太大，1MB 约能放 4000 个会话
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # HSTS。⚠️ 这里只给 300 秒，不是常见的 31536000。
    # 原因：这是 IP 证书，160 小时就过期。如果用户浏览器把 HSTS 记一年，
    # 万一哪天证书没续上或我们回退到 HTTP，访客会连"忽略警告继续访问"都点不了。
    # 等哪天换成域名证书、续期稳定了，再把这个值调大。
    add_header Strict-Transport-Security "max-age=300" always;

    # 上传：Spring 侧 max-request-size 是 60MB，nginx 默认只有 1MB，
    # 不放开的话后台上传 8MB 图片会直接 413，而且报错发生在 nginx 层，
    # 应用日志里什么都看不到，很难查。
    client_max_body_size 60m;
    client_body_timeout  120s;

    # 反代到本机的 Spring Boot
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # ---- 客户端真实 IP ----
        # 用 $remote_addr 覆盖而不是 $proxy_add_x_forwarded_for：
        # 后者会把客户端自己带来的 X-Forwarded-For 追加在后面，
        # 而 ClientIpResolver 取的是"第一段"，访客只要伪造一个 XFF 头
        # 就能冒充任意 IP，把按 IP 的问答限流和访客记录全绕过。
        # 覆盖写死成 nginx 看到的真实对端地址，才是可信的。
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host             $host;

        # ---- SSE（/api/chat 是流式返回）----
        # nginx 默认会缓冲上游响应，流式问答会变成"等全部生成完再一次性吐出来"，
        # 前端看到的就是转圈半天、然后整段文字突然出现。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 告诉上游不要压缩（SSE 压缩后分帧更不可控）
        proxy_set_header Accept-Encoding "";

        # 上传/下载大文件时不限制首包时间
        proxy_connect_timeout 30s;
    }
}
