# /etc/nginx/nginx.conf
# 由 rag-kb 的 deploy/https/install-https.sh 安装；原文件会被备份成 nginx.conf.rag-orig
#
# 为什么整份替换而不是往原文件里加 server 块：
#   CentOS 的 nginx 包在 nginx.conf 里自带一个 `listen 80 default_server` 的
#   server 块（root /usr/share/nginx/html）。我们按 IP 访问时 Host 是 IP，
#   匹配不上任何 server_name，nginx 就会落到那个 default_server 上 —— 结果是
#   ACME 校验文件 404、证书永远签不下来。与其去原文里精准挖掉那一段，不如
#   整份换成这份已知内容的配置，行为完全可控。
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 不回显版本号
    server_tokens   off;

    # 静态资源压缩（前端 dist 里 js/css 都是几百 KB）
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
